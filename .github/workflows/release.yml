name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      - name: Build (self-contained, no .NET install needed on target PC)
        shell: pwsh
        run: ./build.ps1 -SelfContained
      - name: Smoke test
        shell: pwsh
        continue-on-error: true
        run: |
          ./dist/ToolHub/ToolHub.exe --smoke
          Start-Sleep -Seconds 8
          if (Test-Path "$env:APPDATA/ToolHub/smoke.txt") { Get-Content "$env:APPDATA/ToolHub/smoke.txt" }
      - name: Package
        shell: pwsh
        run: |
          $name = "ToolHub-${{ github.ref_name }}-win-x64.zip"
          # 업데이트 버튼이 현재 버전을 알 수 있도록 태그를 version.txt 로 넣고 다시 압축
          Set-Content -NoNewline -Path dist/ToolHub/version.txt -Value "${{ github.ref_name }}"
          Compress-Archive -Path dist/ToolHub/* -DestinationPath $name -Force
          "ASSET=$name" | Out-File -Append -Encoding utf8 $env:GITHUB_ENV
      - name: Publish release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "${{ github.ref_name }}" "$env:ASSET" --title "ToolHub ${{ github.ref_name }}" --generate-notes
